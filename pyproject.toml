[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "psychic-yut-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "numpy>=1.26"]
[project.optional-dependencies]
coreml = ["coremltools>=8.3,<10"]

[tool.setuptools.packages.find]
include = ["yut_ai*"]
